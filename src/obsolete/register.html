<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>

<body>
  <div class="w-embed w-script">

    <!-- Load Alpine first -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>


    <div class="page-shell" x-data="registrationForm()">
      <!-- <div class="page-header"> TODO: wrap all components above the card in a wrapper and make it stick to the top of the page -->

        <div class="language-selector" aria-label="Language selector">
          <label for="language-select" x-text="t('languageLabel')"></label>
          <select id="language-select" x-model="language">
            <option value="en">EN</option>
            <option value="es">ES</option>
            <option value="uk">UA</option>
            <option value="ru">RU</option>
          </select>
        </div>

        <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
          <symbol id="logo" viewBox="0 0 232 30" fill="none">

            <defs>
              <clipPath id="clip0_24_430">
                <rect width="232" height="30" fill="white" />
              </clipPath>
            </defs>
          </symbol>
          <symbol id="phone-icon" viewBox="0 0 24 24">
            <path
              d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" />
          </symbol>
        </svg>

          <!-- Mobile Contact Us button (top-right corner) -->
          <a href="tel:+19162694606" class="contact-us-mobile">
            <svg width="20" height="20" fill="currentColor">
              <use href="#phone-icon"></use>
            </svg>
            <span x-text="t('contactUs')"></span>
          </a>

        <svg class="page-logo" aria-label="iTRUCKING">
          <use href="#logo"></use>
        </svg>

        <div class="page-hero">
          <template x-if="pageTitleIconUrl">
            <div class="page-title-row">
              <span class="page-title-icon" x-html="pageTitleIconUrl"></span>
              <h1 class="page-title" x-text="pageTitle"></h1>
            </div>
          </template>

          <template x-if="!pageTitleIconUrl">
            <h1 class="page-title" x-text="pageTitle"></h1>
          </template>

          <p class="page-subtitle" x-show="!pageSubtitleStrong">
            <span x-text="pageSubtitle"></span>
          </p>

          <p class="page-subtitle" x-show="pageSubtitleStrong">
            <span x-text="pageSubtitle"></span><span class="page-subtitle-strong" x-text="pageSubtitleStrong"></span>
          </p>
        </div>
      <!-- Wrapper end </div> -->
      <div class="card">

        <!-- Progress bar -->
        <div class="otp-progress">
          <p class="otp-progress-label" x-text="progressTitle"></p>
          <div class="otp-progress-track" aria-label="Application progress">
            <div class="otp-progress-fill" :style="`width: ${progressFillPercent}%;`"></div>
          </div>
        </div>

        <!-- Step 1: Contact Information -->
        <div x-cloak x-show="step === 1">
          <div class="step-header">
            <h2 x-text="t('step1Title')"></h2>
            <p class="step-subtitle" x-text="t('step1Subtitle')"></p>
          </div>

          <div class="field-row">
            <div class="field">
              <p class="form-label" x-text="t('labelFirstName')"></p>
              <input class="form-input" type="text" x-model="form.firstName" :placeholder="t('placeholderFirstName')">
              <template x-if="errors.firstName">
                <div class="error" x-text="errors.firstName"></div>
              </template>
            </div>
            <div class="field">
              <p class="form-label" x-text="t('labelLastName')"></p>
              <input class="form-input" type="text" x-model="form.lastName" :placeholder="t('placeholderLastName')">
              <template x-if="errors.lastName">
                <div class="error" x-text="errors.lastName"></div>
              </template>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <p class="form-label" x-text="t('labelEmail')"></p>
              <input class="form-input" type="email" x-model="form.email" :placeholder="t('placeholderEmail')">
              <template x-if="errors.email">
                <div class="error" x-text="errors.email"></div>
              </template>
            </div>
            <div class="field">
              <p class="form-label" x-text="t('labelPhone')"></p>
              <input class="form-input" type="tel" :value="formatPhone(form.phone)"
                @input="form.phone = normalizeDigits($event.target.value, 10)" :placeholder="t('placeholderPhone')"
                inputmode="numeric" maxlength="14">
              <template x-if="errors.phone">
                <div class="error" x-text="errors.phone"></div>
              </template>
            </div>
          </div>

          <p class="helper-text" x-text="t('helperEmail')"></p>

          <div class="page-actions page-actions-end">
            <button class="primary review-next" @click="next()" x-text="t('nextStep')"></button>
          </div>
        </div>

        <!-- Step 2: Account Type -->
        <div x-cloak x-show="step === 2">
          <div class="account-step-header">
            <h2 x-text="t('step2Title')"></h2>
            <p class="account-step-subtitle" x-text="t('step2Subtitle')"></p>
          </div>

          <div class="account-cards">
            <div class="account-card" :class="{ selected: form.accountType === 'personal' }"
              @click="form.accountType = 'personal'">
              <label class="account-pill">
                <input type="radio" name="acctType" value="personal" x-model="form.accountType">
                <span x-text="t('accountPersonalLabel')"></span>
              </label>
              <span class="fuel-radio-dot" aria-hidden="true"></span>
              <div class="account-card-content">
                <h3 class="account-card-title" x-text="t('accountPersonalTitle')"></h3>
                <p class="account-card-text" x-html="t('accountPersonalText')"></p>
              </div>
            </div>
            <div class="account-card" :class="{ selected: form.accountType === 'business' }"
              @click="form.accountType = 'business'">
              <label class="account-pill">
                <input type="radio" name="acctType" value="business" x-model="form.accountType">
                <span x-text="t('accountBusinessLabel')"></span>
              </label>
              <span class="fuel-radio-dot" aria-hidden="true"></span>
              <div class="account-card-content">
                <h3 class="account-card-title" x-text="t('accountBusinessTitle')"></h3>
                <p class="account-card-text" x-html="t('accountBusinessText')"></p>
                <p class="account-card-text">

                    class="bulb-icon">

                      fill="#210B20"></path>
                  </svg>
                  <span x-html="t('accountBusinessNote')"></span>
                </p>
              </div>
            </div>
          </div>
          <template x-if="errors.accountType">
            <div class="error" x-text="errors.accountType"></div>
          </template>

          <div x-show="form.accountType === 'business'" class="confirm-row">
            <input type="checkbox" x-model="form.businessOwnerConfirm">
            <p class="confirm-text" x-html="t('accountBusinessConfirm')"></p>
          </div>
          <template x-if="errors.businessOwnerConfirm">
            <div class="error" x-text="errors.businessOwnerConfirm"></div>
          </template>

          <div x-show="form.accountType === 'personal'" class="field-row" style="margin-top:20px; justify-content:center;">
            <div class="field" style="max-width:220px; width:100%;">
              <p class="form-label" x-text="t('labelFleetSize')"></p>
              <input class="form-input" type="number" min="1" x-model.number="form.fleetSize" :placeholder="t('placeholderFleetSize')" style="height:48px; font-size:16px; padding:0 20px;">
              <template x-if="errors.fleetSize">
                <div class="error" x-text="errors.fleetSize"></div>
              </template>
            </div>
          </div>

          <p class="helper-text" x-text="t('helperReviewSign')"></p>
          <div class="page-actions">
            <button class="secondary-filled review-next" @click="prev()" x-text="t('previousStep')"></button>
            <a href="tel:+19162694606" class="contact-us-btn desktop-only">
              <svg width="20" height="20" fill="currentColor">
                <use href="#phone-icon"></use>
              </svg>
              <span x-text="t('contactUs')"></span>
            </a>
            <button class="primary review-next" @click="next()" x-text="t('nextStep')"></button>
          </div>
        </div>

        <!-- Step 3: Company Information (shown if business) -->
        <div x-cloak x-show="step === 3">
          <div class="step-header">
            <h2 x-text="t('step3Title')"></h2>
            <p class="step-subtitle" x-text="t('step3Subtitle')"></p>
          </div>

          <div class="field-row">
            <div class="field">
              <p class="form-label" x-text="t('labelCompanyName')"></p>
              <input class="form-input" type="text" x-model="form.companyName" :placeholder="t('placeholderCompanyName')">
              <template x-if="errors.companyName">
                <div class="error" x-text="errors.companyName"></div>
              </template>
            </div>
            <div class="field">
              <p class="form-label" x-text="t('labelBusinessType')"></p>
              <div class="select-wrap">
                <select class="form-input select-input" x-model="form.businessType">
                  <option value="" disabled x-text="t('selectPlaceholder')"></option>
                  <option value="sole-proprietorship" x-text="t('businessTypeSole')"></option>
                  <option value="partnership" x-text="t('businessTypePartnership')"></option>
                  <option value="llc" x-text="t('businessTypeLlc')"></option>
                  <option value="corporation" x-text="t('businessTypeCorporation')"></option>
                </select>
                <span class="select-caret" aria-hidden="true"></span>
              </div>
              <template x-if="errors.businessType">
                <div class="error" x-text="errors.businessType"></div>
              </template>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <p class="form-label" x-text="t('labelCompanyTitle')"></p>
              <div class="select-wrap">
                <select class="form-input select-input" x-model="form.companyTitle">
                  <option value="" disabled x-text="t('selectPlaceholder')"></option>
                  <option value="CEO">CEO</option>
                  <option value="CFO">CFO</option>
                  <option value="ACCOUNTANT" x-text="t('companyTitleAccountant')"></option>
                  <option value="PRESIDENT" x-text="t('companyTitlePresident')"></option>
                  <option value="OWNER" x-text="t('companyTitleOwner')"></option>
                  <option value="Other" x-text="t('companyTitleOther')"></option>
                </select>
                <span class="select-caret" aria-hidden="true"></span>
              </div>
              <template x-if="errors.companyTitle">
                <div class="error" x-text="errors.companyTitle"></div>
              </template>
            </div>
            <div class="field">
              <p class="form-label" x-text="t('labelFleetSize')"></p>
              <input class="form-input" type="number" min="0" x-model.number="form.fleetSize" :placeholder="t('placeholderFleetSize')">
              <template x-if="errors.fleetSize">
                <div class="error" x-text="errors.fleetSize"></div>
              </template>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <p class="form-label" x-text="t('labelDotOptional')"></p>
              <input class="form-input" type="text" :value="form.dot"
                @input="form.dot = normalizeDigits($event.target.value)" :placeholder="t('placeholderDot')"
                inputmode="numeric">
            </div>
            <div class="field">
              <p class="form-label" x-text="t('labelMcOptional')"></p>
              <input class="form-input" type="text" :value="form.mc"
                @input="form.mc = normalizeDigits($event.target.value)" :placeholder="t('placeholderMc')"
                inputmode="numeric">
            </div>
          </div>

          <p class="helper-text" x-text="t('helperReviewSign')"></p>
          <div class="page-actions">
            <button class="secondary-filled review-next" @click="prev()" x-text="t('previousStep')"></button>
            <a href="tel:+19162694606" class="contact-us-btn desktop-only">
              <svg width="20" height="20" fill="currentColor">
                <use href="#phone-icon"></use>
              </svg>
              <span x-text="t('contactUs')"></span>
            </a>
            <button class="primary review-next" @click="next()" x-text="t('nextStep')"></button>
          </div>
        </div>

        <!-- Step 4: Fuel Program  -->
        <div x-cloak x-show="step === 4">
          <div class="step-header">
            <h2 x-text="t('step4FuelTitle')"></h2>
            <p class="step-subtitle" x-text="t('step4FuelSubtitle')"></p>
          </div>

          <div class="fuel-options">
            <label class="fuel-option">
              <input type="radio" x-model="form.usedFuelProgram" value="yes">
              <span class="fuel-radio-dot" aria-hidden="true"></span>
              <span class="fuel-option-label" x-text="t('fuelYesOption')"></span>
            </label>
            <label class="fuel-option">
              <input type="radio" x-model="form.usedFuelProgram" value="no">
              <span class="fuel-radio-dot" aria-hidden="true"></span>
              <span class="fuel-option-label" x-text="t('fuelNoOption')"></span>
            </label>
          </div>

          <template x-if="errors.usedFuelProgram">
            <div class="error" x-text="errors.usedFuelProgram"></div>
          </template>

          <!-- File upload section - only shown when "Yes" is selected -->
          <template x-if="form.usedFuelProgram === 'yes'">
            <div class="fuel-upload-section">
              <input class="sr-only" type="file" id="fuel-invoice" @change="onFileSelect($event, 'fuelInvoice')"
                accept="image/*,application/pdf">
              <button class="attach-button" type="button" @click="document.getElementById('fuel-invoice').click()"
                x-text="form.files?.fuelInvoice?.filename ? t('changeFuelInvoice') : t('attachFuelInvoice')"></button>

              <!-- Upload status feedback -->
              <template x-if="uploadStatus.fuelInvoice.type === 'success' || form.files?.fuelInvoice?.filename">
                <div class="upload-status success">
                  <svg class="upload-status-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
                  </svg>
                  <span class="upload-filename" x-text="form.files?.fuelInvoice?.filename || 'Uploaded'"></span>
                </div>
              </template>
              <template x-if="uploadStatus.fuelInvoice.type === 'error'">
                <div class="upload-status error">
                  <svg class="upload-status-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path
                      d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
                  </svg>
                  <span x-text="uploadStatus.fuelInvoice.message"></span>
                </div>
              </template>

              <div class="fuel-upload-header">
                <p class="fuel-upload-title" x-text="t('fuelUploadTitle')"></p>
                <p class="fuel-upload-subtitle" x-text="t('fuelUploadSubtitle')"></p>
              </div>
            </div>
          </template>

          <p class="helper-text" x-text="t('helperReviewSign')"></p>
          <div class="page-actions">
            <button class="secondary-filled review-next" @click="prev()" x-text="t('previousStep')"></button>
            <a href="tel:+19162694606" class="contact-us-btn desktop-only">
              <svg width="20" height="20" fill="currentColor">
                <use href="#phone-icon"></use>
              </svg>
              <span x-text="t('contactUs')"></span>
            </a>
            <button class="primary review-next" @click="next()" x-text="t('nextStep')"></button>
          </div>
        </div>

        <!-- Step 5: Referral -->
        <div x-cloak x-show="step === 5">
          <div class="step-header">
            <h2 x-text="t('step4Title')"></h2>
            <p class="step-subtitle" x-html="t('step4Subtitle')"></p>
          </div>

          <div class="field-row">
            <div class="field">
              <p class="form-label" x-text="t('labelRefFirstName')"></p>
              <input class="form-input" type="text" x-model="form.refFirstName" :placeholder="t('placeholderFirstName')">
              <template x-if="errors.refFirstName">
                <div class="error" x-text="errors.refFirstName"></div>
              </template>
            </div>
            <div class="field">
              <p class="form-label" x-text="t('labelRefLastName')"></p>
              <input class="form-input" type="text" x-model="form.refLastName" :placeholder="t('placeholderLastName')">
              <template x-if="errors.refLastName">
                <div class="error" x-text="errors.refLastName"></div>
              </template>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <p class="form-label" x-text="t('labelRefCompany')"></p>
              <input class="form-input" type="text" x-model="form.refCompany" :placeholder="t('placeholderRefCompany')">
            </div>
            <div class="field">
              <p class="form-label" x-text="t('labelPhone')"></p>
              <input class="form-input" type="tel" :value="formatPhone(form.refPhone)"
                @input="form.refPhone = normalizeDigits($event.target.value, 10)" :placeholder="t('placeholderPhone')"
                inputmode="numeric" maxlength="14">
              <template x-if="errors.refPhone">
                <div class="error" x-text="errors.refPhone"></div>
              </template>
            </div>
          </div>

          <div class="field-row">
            <div class="field" style="flex: 1 1 100%;">
              <p class="form-label" x-text="t('labelRefNotes')"></p>
              <textarea class="form-input" x-model="form.refNotes" :placeholder="t('placeholderRefNotes')" rows="3"></textarea>
            </div>
          </div>

          <p class="helper-text" x-text="t('helperReferral')"></p>

          <div class="page-actions">
            <button class="secondary-filled review-next" @click="prev()" x-text="t('previousStep')"></button>
            <a href="tel:+19162694606" class="contact-us-btn desktop-only">
              <svg width="20" height="20" fill="currentColor">
                <use href="#phone-icon"></use>
              </svg>
              <span x-text="t('contactUs')"></span>
            </a>
            <button class="primary review-next" @click="next()" x-text="t('nextStep')"></button>
          </div>
        </div>

        <!-- Step 6: Summary & Submit -->
        <div x-cloak x-show="step === 6">
          <div class="step-header">
            <h2 x-text="t('step5Title')"></h2>
            <p class="step-subtitle" x-text="t('step5Subtitle')"></p>
          </div>

          <div class="summary-row">
            <div class="summary-main">
              <div class="summary-title" x-text="t('summaryContactTitle')"></div>
              <p class="summary-text">
                <span x-text="form.firstName"></span>
                <span> </span>
                <span x-text="form.lastName"></span>,
                <span> </span>
                <span x-text="form.email"></span>,
                <span> </span>
                <span x-text="form.phone"></span>
              </p>
            </div>
            <button type="button" class="summary-edit" @click="step = 1" :aria-label="t('ariaEditContact')">
              <span class="summary-edit-icon" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M16.862 3.487a2 2 0 0 1 2.828 0l.823.823a2 2 0 0 1 0 2.828L9.41 18.243a2 2 0 0 1-.845.51l-4.25 1.417a.75.75 0 0 1-.948-.948l1.417-4.25a2 2 0 0 1 .51-.845L16.862 3.487Z"
                    stroke="#231E20" stroke-width="1.6" />
                  <path d="M15.5 4.85 19.15 8.5" stroke="#231E20" stroke-width="1.6" />
                </svg>
              </span>
              <p class="summary-edit-label" x-text="t('editLabel')"></p>
            </button>
          </div>

          <template x-if="form.accountType === 'personal'">
            <div class="summary-row">
              <div class="summary-main">
                <div class="summary-title" x-text="t('summaryFleetTitle')"></div>
                <p class="summary-text">
                  <span x-text="form.fleetSize"></span>
                  <span> </span>
                  <span x-text="t('summaryTrucks')"></span>
                </p>
              </div>
              <button type="button" class="summary-edit" @click="step = 2" :aria-label="t('ariaEditFleet')">
                <span class="summary-edit-icon" aria-hidden="true">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16.862 3.487a2 2 0 0 1 2.828 0l.823.823a2 2 0 0 1 0 2.828L9.41 18.243a2 2 0 0 1-.845.51l-4.25 1.417a.75.75 0 0 1-.948-.948l1.417-4.25a2 2 0 0 1 .51-.845L16.862 3.487Z" stroke="#231E20" stroke-width="1.6" />
                    <path d="M15.5 4.85 19.15 8.5" stroke="#231E20" stroke-width="1.6" />
                  </svg>
                </span>
                <p class="summary-edit-label" x-text="t('editLabel')"></p>
              </button>
            </div>
          </template>

          <template x-if="form.accountType === 'business'">
            <div class="summary-row">
              <div class="summary-main">
                <div class="summary-title" x-text="t('summaryBusinessTitle')"></div>
                <p class="summary-text">
                  <span x-text="form.companyName"></span>,
                  <span> </span>
                  <span x-text="businessTypeLabel(form.businessType)"></span>,
                  <span> </span>
                  <span x-text="companyTitleLabel(form.companyTitle)"></span>,
                  <span> </span>
                  <span x-text="form.fleetSize"></span>
                  <span> </span>
                  <span x-text="t('summaryTrucks')"></span>
                  <span>, </span>
                  <span x-text="t('summaryDotLabel')"></span>
                  <span> </span>
                  <span x-text="form.dot || t('notAvailable')"></span>
                  <span>, </span>
                  <span x-text="t('summaryMcLabel')"></span>
                  <span> </span>
                  <span x-text="form.mc || t('notAvailable')"></span>
                </p>
              </div>
              <button type="button" class="summary-edit" @click="step = 3" :aria-label="t('ariaEditBusiness')">
                <span class="summary-edit-icon" aria-hidden="true">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M16.862 3.487a2 2 0 0 1 2.828 0l.823.823a2 2 0 0 1 0 2.828L9.41 18.243a2 2 0 0 1-.845.51l-4.25 1.417a.75.75 0 0 1-.948-.948l1.417-4.25a2 2 0 0 1 .51-.845L16.862 3.487Z"
                      stroke="#231E20" stroke-width="1.6" />
                    <path d="M15.5 4.85 19.15 8.5" stroke="#231E20" stroke-width="1.6" />
                  </svg>
                </span>
                <p class="summary-edit-label" x-text="t('editLabel')"></p>
              </button>
            </div>
          </template>

          <div class="summary-row">
            <div class="summary-main">
              <div class="summary-title" x-text="t('summaryReferralTitle')"></div>
              <p class="summary-text">
                <span x-text="form.refFirstName || t('notAvailable')"></span>
                <span> </span>
                <span x-text="form.refLastName"></span>,
                <span> </span>
                <span x-text="form.refCompany || t('notAvailable')"></span>,
                <span> </span>
                <span x-text="form.refPhone || t('notAvailable')"></span>
              </p>
              <template x-if="form.refNotes">
                <p class="summary-text" x-text="form.refNotes"></p>
              </template>
            </div>
            <button type="button" class="summary-edit" @click="step = 5" :aria-label="t('ariaEditReferral')">
              <span class="summary-edit-icon" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M16.862 3.487a2 2 0 0 1 2.828 0l.823.823a2 2 0 0 1 0 2.828L9.41 18.243a2 2 0 0 1-.845.51l-4.25 1.417a.75.75 0 0 1-.948-.948l1.417-4.25a2 2 0 0 1 .51-.845L16.862 3.487Z"
                    stroke="#231E20" stroke-width="1.6" />
                  <path d="M15.5 4.85 19.15 8.5" stroke="#231E20" stroke-width="1.6" />
                </svg>
              </span>
              <p class="summary-edit-label" x-text="t('editLabel')"></p>
            </button>
          </div>

          <div class="summary-footer" x-text="t('helperReviewSign')"></div>
          <div class="page-actions">
            <button class="secondary-filled review-next" @click="prev()" x-text="t('previousStep')"></button>
            <a href="tel:+19162694606" class="contact-us-btn desktop-only">
              <svg width="20" height="20" fill="currentColor">
                <use href="#phone-icon"></use>
              </svg>
              <span x-text="t('contactUs')"></span>
            </a>
            <button class="primary review-next" @click="submit()" :disabled="submitting">
              <span x-text="submitting ? t('submitting') : t('submit')"></span>
            </button>
          </div>
        </div>

        <!-- Step 7: Application received -->
        <div x-cloak x-show="step === 7">
          <div class="received-body">
            <p class="received-lead" x-text="receivedLead"></p>

            <p class="received-mid">
              <span x-text="t('receivedPrepareStart')"></span>
              <span class="received-strong" x-text="t('receivedPrepareLicense')"></span>
              <span x-text="t('receivedPrepareEnd')"></span>
            </p>

            <p class="received-lead" x-text="t('receivedContactTimeline')"></p>
          </div>

          <div class="received-footer">
            <span x-text="t('receivedFooter')"></span>
          </div>
        </div>

      </div>


      <script src="./assets/shared.js"></script>
      <script src="./assets/register.js"></script>

    </div><!-- end page-shell -->

  </div><!-- end w-embed -->

</body>

</html>
