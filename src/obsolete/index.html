<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Flow</title>
  <link rel="stylesheet" href="./assets/style.css">
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <script>
    window.APP_CONFIG = {
      plaid_combined_link_enabled: 'false',
      plaid_step5_enabled: 'true',
    };
  </script>
</head>

<body>
  <div class="w-embed w-script">

    <!-- Load Alpine first -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <div class="page-shell" x-data="registrationForm()">
      <div class="page-header">
        <div class="language-selector" aria-label="Language selector">
          <label for="language-select" x-text="t('languageLabel')"></label>
          <select id="language-select" x-model="language">
            <option value="en">EN</option>
            <option value="es">ES</option>
            <option value="uk">UA</option>
            <option value="ru">RU</option>
          </select>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
          <symbol id="logo" viewBox="0 0 232 30" fill="none">
            <g clip-path="url(#clip0_24_430)">
              <path d="M4.02871 19.3462L0 30H10.6313L14.66 19.3462H4.02871Z" fill="#D42C00" />
              <path d="M26.2891 30H32.4949C35.1585 30 37.5445 28.3491 38.4883 25.853L40.9489 19.3462H30.3176L26.2891 30Z"
                fill="#D42C00" />
              <path
                d="M15.7704 -1.90735e-06C13.1068 -1.90735e-06 10.7209 1.6508 9.77691 4.1469L7.31641 10.6537H20.4609L13.1452 30H23.7765L31.092 10.6537H44.2365L48.2652 -1.90735e-06H15.7704Z"
                fill="#D42C00" />
              <path d="M56.4198 11.0062H60.6809V24.7875H56.4198V11.0062ZM56.3926 5.15929H60.7081V8.94723H56.3926V5.15929Z"
                fill="#231E20" />
              <path d="M71.6077 9.07962H64.5879V5.15929H83.1071V9.07962H76.1146V24.7875H71.6077V9.07962Z"
                fill="#231E20" />
              <path
                d="M96.7925 14.5363C99.2234 14.5363 100.316 13.9536 100.316 11.7285C100.316 9.45051 99.2778 8.86775 96.7377 8.86775H91.5208V14.5363H96.7925ZM96.0549 18.2712H91.5208V24.7875H87.1504V5.15929H96.9289C103.293 5.15929 104.823 7.80814 104.823 11.5696C104.823 14.2714 103.922 16.7614 100.562 17.7944L104.577 24.7875H99.7969L96.0549 18.2712Z"
                fill="#231E20" />
              <path
                d="M109.465 17.2912V5.15931H113.944V16.7349C113.944 19.6487 114.682 21.3175 118.779 21.3175C122.849 21.3175 123.641 19.7546 123.641 16.7349V5.15931H127.984V17.2912C127.984 21.0525 127.247 25.1583 118.725 25.1583C110.175 25.1583 109.465 21.0525 109.465 17.2912Z"
                fill="#231E20" />
              <path
                d="M132.301 14.9601C132.301 7.91406 136.262 4.84134 142.981 4.84134C146.669 4.84134 149.018 5.79498 150.93 7.6757L147.843 10.6689C146.614 9.50337 145.166 8.81471 142.954 8.81471C138.638 8.81471 136.808 10.9338 136.808 15.0131C136.808 18.9599 138.338 21.2114 142.981 21.2114C145.603 21.2114 146.86 20.3638 148.116 19.2247L151.066 22.0326C149.455 23.6484 147.297 25.0788 142.708 25.0788C135.142 25.0788 132.301 21.4499 132.301 14.9601Z"
                fill="#231E20" />
              <path
                d="M163.057 16.2316L160.189 19.5162V24.7875H155.764V5.15929H160.189V14.0331L167.864 5.15929H172.808L165.952 12.9205L173.792 24.7875H168.738L163.057 16.2316Z"
                fill="#231E20" />
              <path d="M178.463 5.15931H182.915V24.7875H178.463V5.15931Z" fill="#231E20" />
              <path
                d="M188.896 5.15931H193.731L203.046 17.5296V5.15931H207.307V24.7875H203.21L193.185 11.5431V24.7875H188.896V5.15931Z"
                fill="#231E20" />
              <path
                d="M211.924 14.9601C211.924 7.8611 215.748 4.84137 222.576 4.84137C226.673 4.84137 229.159 6.00688 230.771 7.62275L227.712 10.616C226.674 9.66235 225.335 8.81474 222.549 8.81474C218.124 8.81474 216.403 10.9338 216.403 15.0131C216.403 19.3042 217.605 21.4234 222.494 21.4234C226.428 21.4234 227.575 20.1519 227.575 17.3971V16.9732H221.921V13.3708H232V16.5759C232 22.165 229.706 25.0788 222.276 25.0788C214.191 25.0788 211.924 21.4763 211.924 14.9601Z"
                fill="#231E20" />
            </g>
            <defs>
              <clipPath id="clip0_24_430">
                <rect width="232" height="30" fill="white" />
              </clipPath>
            </defs>
          </symbol>
          <symbol id="phone-icon" viewBox="0 0 24 24">
            <path
              d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" />
          </symbol>
        </svg>

        <!-- Mobile Contact Us button (top-right corner) -->
        <a href="tel:+19162694606" class="contact-us-mobile">
          <svg width="20" height="20" fill="currentColor">
            <use href="#phone-icon"></use>
          </svg>
          <span x-text="t('contactUs')"></span>
        </a>

        <!-- Figma Step 1 wrapper (OTP) -->
        <svg x-cloak x-show="step === 1" class="page-logo" alt="">
          <use href="#logo"></use>
        </svg>

        <!-- Figma Step 2 wrapper (Review information) -->
        <svg x-cloak x-show="step === 2" class="page-logo">
          <use href="#logo"></use>
        </svg>
        <div x-cloak x-show="step === 2" class="page-hero" style="gap:0;">
          <p class="page-title" x-html="t('pageTitleStep2')"></p>
        </div>

        <!-- Figma Step 3 wrapper (Continue filling out the form) -->
        <svg x-cloak x-show="step === 3 || step === 4 || step === 5 || step === 6 || step === 7 || step === 8"
          class="page-logo">
          <use href="#logo"></use>
        </svg>

        <div x-cloak x-show="step === 3 || step === 4 || step === 5 || step === 6 || step === 7 || step === 8"
          class="page-hero">
          <p class="page-title" x-text="t('pageTitleStep3')"></p>
          <p class="page-subtitle" x-text="t('pageSubtitleStep3')"></p>
        </div>

        <!-- Figma Step 9 wrapper (Review summary) -->
        <svg x-cloak x-show="step === 9" class="page-logo">
          <use href="#logo"></use>
        </svg>

        <div x-cloak x-show="step === 9" class="page-hero" style="gap:15px;">
          <p class="page-title" x-text="t('pageTitleStep9')"></p>
          <p class="page-subtitle page-subtitle-narrow" x-text="t('pageSubtitleStep9')"></p>
        </div>

        <!-- Figma Step 10 wrapper (Terms) -->
        <svg x-cloak x-show="step === 10" class="page-logo">
          <use href="#logo"></use>
        </svg>

        <div x-cloak x-show="step === 10" class="page-hero" style="gap:15px;">
          <p class="page-title" x-text="t('pageTitleStep10')"></p>
          <p class="page-subtitle page-subtitle-narrow" x-text="t('pageSubtitleStep10')"></p>
        </div>

        <!-- Figma Step 11 wrapper (Congratulations) -->
        <svg x-cloak x-show="step === 11 || step === 12" class="page-logo">
          <use href="#logo"></use>
        </svg>

        <div x-cloak x-show="step === 11 || step === 12" class="page-hero" style="gap:10px;">
          <p class="page-title" x-text="t('pageTitleStep11')"></p>
          <p class="page-subtitle" x-text="t('pageSubtitleStep11')"></p>
        </div>
      </div>

      <div class="card">

        <!-- Progress bar (existing, non-Figma) -->
        <div x-cloak
          x-show="step !== 1 && step !== 2 && step !== 3 && step !== 4 && step !== 5 && step !== 6 && step !== 7 && step !== 8 && step !== 9 && step !== 10 && step !== 11 && step !== 12"
          class="progress-wrapper" style="margin-bottom:24px;">
          <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
            <template x-for="(label, index) in progressLabels()">
              <div style="text-align:center; width:9%; font-size:11px;">
                <div x-text="label" :style="index + 1 === step ? 'font-weight:600; color:#2563eb;' : 'color:#6b7280;'">
                </div>
              </div>
            </template>
          </div>

          <div style="position:relative; height:6px; background:#e5e7eb; border-radius:4px; overflow:hidden;">
            <div style="height:100%; background:#2563eb; width:0%; transition:width .3s ease;"
              :style="`width: ${((step - 1) / 10) * 100}%`">
            </div>
            <div
              style="height:100%; background:#2563eb; width:0%; position:absolute; top:0; left:0; transition:width .3s ease;"
              :style="step === 11 ? 'width:100%;' : ''">
            </div>
          </div>
        </div>

        <!-- Figma progress (Step 1 only) -->
        <div x-cloak x-show="step === 1" class="otp-progress">
          <p class="otp-progress-label" x-text="t('progressLabel')"></p>
          <div class="otp-progress-track">
            <div class="otp-progress-fill" :style="`width:${progressPercent()}%`"></div>
          </div>
        </div>

        <!-- Figma progress (Step 2 only) -->
        <div x-cloak x-show="step === 2" class="otp-progress">
          <p class="otp-progress-label" x-text="t('progressLabel')"></p>
          <div class="otp-progress-track">
            <div class="otp-progress-fill" :style="`width:${progressPercent()}%`"></div>
          </div>
        </div>

        <!-- Figma progress (Step 3 only) -->
        <div x-cloak x-show="step === 3 || step === 4 || step === 5 || step === 6 || step === 7 || step === 8"
          class="otp-progress">
          <p class="otp-progress-label" x-text="t('progressLabel')"></p>
          <div class="otp-progress-track">
            <div class="otp-progress-fill" :style="`width:${progressPercent()}%`"></div>
          </div>
        </div>

        <!-- Figma progress (Step 9 only) -->
        <div x-cloak x-show="step === 9" class="otp-progress">
          <p class="otp-progress-label" x-text="t('progressLabel')"></p>
          <div class="otp-progress-track">
            <div class="otp-progress-fill" :style="`width:${progressPercent()}%`"></div>
          </div>
        </div>

        <!-- Figma progress (Step 10 only) -->
        <div x-cloak x-show="step === 10" class="otp-progress">
          <p class="otp-progress-label" x-text="t('progressLabel')"></p>
          <div class="otp-progress-track">
            <div class="otp-progress-fill" :style="`width:${progressPercent()}%`"></div>
          </div>
        </div>

        <!-- Step 1: OTP Verification -->
        <div x-cloak x-show="step === 1">
          <div class="otp-content">
            <div class="otp-welcome">
              <p class="otp-welcome-title" x-text="t('otpWelcomeTitle')"></p>
              <p class="otp-welcome-subtitle" x-text="t('otpWelcomeSubtitle')"></p>
            </div>

            <p class="otp-message" x-text="t('otpMessage')"></p>

            <div class="otp-form">
              <template x-if="!pendingMessage">
                <div style="width:100%; display:flex; flex-direction:column; align-items:center;">
                  <div x-show="!showEmailRecovery || recoverySent" style="width:100%; display:flex; flex-direction:column; align-items:center;">
                    <label class="sr-only" for="otp" x-text="t('otpLabel')"></label>
                    <input id="otp" class="otp-input" type="text" x-model="form.otp" maxlength="6"
                      :placeholder="t('otpPlaceholder')" autocomplete="one-time-code" inputmode="text" autocapitalize="characters" style="text-transform:uppercase;">

                    <template x-if="errors.otp">
                      <div class="otp-error" x-text="errors.otp"></div>
                    </template>
                  </div>

                  <!-- Email recovery block — revealed when OTP code is invalid or already used -->
                  <div x-show="showEmailRecovery" style="width:100%; display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:12px;">
                    <template x-if="!recoverySent">
                      <div style="width:100%; display:flex; flex-direction:column; align-items:center; gap:8px;">
                        <div class="otp-error" x-text="t('otpInvalidCodeWarning')"></div>
                        <label class="sr-only" x-text="t('otpRecoveryLabel')"></label>
                        <input class="otp-input" type="email" x-model="recoveryEmail"
                          :placeholder="t('otpRecoveryPlaceholder')" autocomplete="email">
                        <button class="primary otp-button" @click="requestNewCode()" :disabled="recoverySending">
                          <span x-text="recoverySending ? t('otpRecoveryButtonSending') : t('otpRecoveryButton')"></span>
                        </button>
                      </div>
                    </template>
                    <template x-if="recoverySent">
                      <div class="otp-pending" x-text="t('otpRecoverySent')"></div>
                    </template>
                  </div>
                </div>
              </template>

              <button class="primary otp-button" x-show="!showEmailRecovery || recoverySent" @click="verifyOtp()" :disabled="verifying">
                <span x-text="verifying ? t('otpVerifying') : (pendingMessage ? t('otpRetry') : t('otpNext') )"></span>
              </button>

              <template x-if="pendingMessage">
                <div class="otp-pending" x-text="pendingMessage"></div>
              </template>
            </div>

            <div class="otp-note">
              <p x-html="t('otpNoteLine1')"></p>
              <p x-text="t('otpNoteLine2')"></p>
            </div>
          </div>
        </div>

        <!-- Step 2: Lead Summary from validate-otp -->
        <div x-cloak x-show="step === 2">
          <div class="review-layout">
            <template x-if="lead">
              <div class="review-sections">
                <div>
                  <p class="review-section-title" x-text="t('step2ContactTitle')"></p>
                  <p class="review-section-text">
                    <span x-text="lead.firstName + ' ' + lead.lastName"></span>,
                    <span x-text="lead.email"></span>,
                    <span x-text="lead.phone"></span>
                  </p>
                  <template x-if="errors.contactEmail">
                    <div class="field-error" x-text="errors.contactEmail"></div>
                  </template>
                  <template x-if="errors.contactPhone">
                    <div class="field-error" x-text="errors.contactPhone"></div>
                  </template>
                </div>

                <div>
                  <p class="review-section-title" x-text="t('step2BusinessTitle')"></p>
                  <p class="review-section-text">
                    <span x-text="lead.companyName"></span>,
                    <span x-text="lead.companyTitle"></span> -
                    <span x-text="lead.firstName + ' ' + lead.lastName"></span>,
                    <span x-text="lead.fleetSize"></span> <span x-text="t('fleetTrucks')"></span><template
                      x-if="lead.dot">,
                      <span>DOT <span x-text="lead.dot"></span></span></template><template x-if="lead.mc">,
                      <span>MC <span x-text="lead.mc"></span></span></template>
                  </p>
                </div>

                <div>
                  <p class="review-section-title" x-text="t('step2RecommendedTitle')"></p>
                  <p class="review-section-text">
                    <span x-text="[lead.refFirstName, lead.refLastName].filter(Boolean).join(' ') || ''"></span>
                    <template x-if="lead.refCompany">
                      <span>, <span x-text="lead.refCompany"></span></span>
                    </template>
                    <template x-if="lead.refPhone">
                      <span>, <span x-text="lead.refPhone"></span></span>
                    </template>
                  </p>
                </div>
              </div>
            </template>

            <p class="review-callout">
              <span x-text="t('step2CalloutBefore')"></span>
              <a class="review-phone" href="tel:+19162694606">(916) 269-4606</a>
              <span x-text="t('step2CalloutAfter')"></span>
            </p>

            <div class="review-spacer"></div>

            <div class="review-bottom">
              <div class="review-divider"></div>
              <p class="review-bottom-note" x-text="t('reviewBottomNote')"></p>
            </div>

          </div>
        </div>

        <!-- Step 3: Plaid bank verification (first step after Step 2 review) -->
        <div x-cloak x-show="step === 3">
          <div class="form-layout">
            <div class="company-head" x-show="!shouldShowPlaidIntroCard()">
              <p class="company-title" x-text="t('step5Title')"></p>
              <p class="company-subtitle" x-text="t('step5Subtitle')"></p>
            </div>

            <div style="max-width:800px; margin:0 auto; display:flex; flex-direction:column; gap:16px;">
              <template x-if="shouldShowPlaidIntroCard()">
                <div class="plaid-intro-card">
                  <div class="plaid-intro-logos">
                    <svg width="89" height="50" viewBox="0 0 89 50" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Plaid connection logos">
                      <rect x="39" width="50" height="50" rx="25" fill="black" />
                      <path fill-rule="evenodd" clip-rule="evenodd" d="M61.4125 12.375L53.6753 14.4014L51.5431 22.1821L54.2099 24.9202L51.5 27.6131L53.5067 35.4278L61.2103 37.5803L63.9208 34.8869L66.5875 37.6244L74.3247 35.598L76.4564 27.8168L73.7901 25.0798L76.5 22.3869L74.4933 14.5716L66.7886 12.4191L64.0792 15.112L61.4125 12.375ZM56.6645 15.8981L60.7402 14.8301L62.5225 16.6597L59.9232 19.2425L56.6645 15.8981ZM65.6116 16.6842L67.4226 14.8849L71.4807 16.0188L68.1688 19.3095L65.6116 16.6842ZM53.9849 21.5434L55.1077 17.4453L58.3654 20.7897L55.7667 23.3725L53.9849 21.5428V21.5434ZM69.7 20.8823L73.012 17.5905L74.0683 21.7072L72.2578 23.507L69.7 20.8823ZM61.455 20.8147L64.0543 18.2319L66.6109 20.8573L64.0122 23.44L61.455 20.8147ZM57.299 24.9447L59.8977 22.3619L62.456 24.9872L59.8562 27.57L57.299 24.9447ZM65.5445 25.0122L68.1433 22.4295L70.7005 25.0548L68.1012 27.6375L65.5445 25.0122ZM53.9306 28.2923L55.7422 26.4919L58.2989 29.1177L54.988 32.4079L53.9306 28.2923ZM61.388 29.1422L63.9872 26.5594L66.5445 29.1847L63.9457 31.7675L61.388 29.1422ZM69.633 29.2103L72.2323 26.6275L74.0146 28.4566L72.8923 32.5547L69.633 29.2103ZM56.5193 33.9811L59.8307 30.6894L62.389 33.3147L60.5774 35.1151L56.5193 33.9811ZM65.4775 33.3397L68.0762 30.7569L71.3345 34.1019L67.2593 35.1693L65.4775 33.3397Z" fill="white" />
                      <g clip-path="url(#clip0_1206_14333)">
                        <circle cx="25" cy="25" r="25" fill="#D42C00" />
                        <g clip-path="url(#clip1_1206_14333)">
                          <path d="M12.3331 27.7231L9.7998 34.3994H16.485L19.0183 27.7231H12.3331Z" fill="white" />
                          <path d="M26.3311 34.3994H30.2334C31.9084 34.3994 33.4088 33.3649 34.0023 31.8006L35.5496 27.7231H28.8644L26.3311 34.3994Z" fill="white" />
                          <path d="M19.7165 15.5994C18.0415 15.5994 16.5411 16.634 15.9476 18.1982L14.4004 22.2758H22.6659L18.0657 34.3994H24.7508L29.3511 22.2758H37.6167L40.15 15.5994H19.7165Z" fill="white" />
                        </g>
                      </g>
                      <defs>
                        <clipPath id="clip0_1206_14333">
                          <rect width="50" height="50" fill="white" />
                        </clipPath>
                        <clipPath id="clip1_1206_14333">
                          <rect width="30.35" height="18.8" fill="white" transform="translate(9.7998 15.5996)" />
                        </clipPath>
                      </defs>
                    </svg>
                  </div>

                  <p class="plaid-intro-title" x-text="t('plaidIntroTitle')"></p>
                  <p class="plaid-intro-subtitle" x-text="t('plaidIntroSubtitle')"></p>

                  <div class="plaid-intro-body">
                    <div class="plaid-intro-bullet-row">
                      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none">
                        <path d="M9.5 0L0 5V7H19V5M14 9V16H17V9M0 21H19V18H0M8 9V16H11V9M2 9V16H5V9H2Z" fill="black"/>
                      </svg>
                      <p class="plaid-intro-bullet-text" x-text="t('plaidIntroBulletBank')"></p>
                    </div>

                    <div class="plaid-intro-bullet-row">
                      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none">

            <a href="tel:+19162694606" class="terms-modal-contact">
              <svg width="20" height="20" fill="currentColor">
                <use href="#phone-icon"></use>
              </svg>
              <span x-text="t('contactUs')"></span>
            </a>
          </div>
        </div>
      </div>

      <!-- Disclaimer Modal (shown after OTP verification) -->
      <div x-cloak x-show="disclaimerModalVisible" class="terms-modal-overlay">
        <div class="terms-modal">
          <p class="terms-modal-title" x-text="t('disclaimerTitle')"></p>
          <p class="terms-modal-text" x-html="t('disclaimerLine1')"></p>
          <p class="terms-modal-text" x-text="t('disclaimerLine2')"></p>
          <p class="terms-modal-text" style="margin-top: 15px;" x-text="t('disclaimerLine3')"></p>
          <div class="terms-modal-actions">
            <button class="primary" @click="disclaimerModalVisible = false" x-text="t('disclaimerCta')"></button>
            <a href="tel:+19162694606" class="terms-modal-contact">
              <svg width="20" height="20" fill="currentColor">
                <use href="#phone-icon"></use>
              </svg>
              <span x-text="t('contactUs')"></span>
            </a>
          </div>
        </div>
      </div>

      <!-- Step 11 submit action (outside the card like Figma) -->
      <div x-cloak x-show="step === 11" class="page-actions page-actions-end">
        <button class="primary review-next" @click="submitFuelCards()" :disabled="fuelCardsSubmitting">
          <span x-text="fuelCardsSubmitting ? t('submitting') : t('submit')"></span>
        </button>
      </div>

      <!-- Contract preparing overlay (shown while submitting) -->
      <div x-cloak x-show="submitting" class="terms-modal-overlay">
        <div class="terms-modal preparing-contract-modal">
          <div class="preparing-contract-spinner">
            <svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
              <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="4"
                stroke-linecap="round" stroke-dasharray="90 60">
                <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25"
                  dur="0.9s" repeatCount="indefinite" />
              </circle>
            </svg>
          </div>
          <p class="terms-modal-title preparing-contract-title" x-text="t('preparingContract')"></p>
        </div>
      </div>

      <script src="./assets/shared.js?v=021826"></script>
      <script src="./assets/index.js?v=021826"></script>
    </div>

  </div>

</body>
