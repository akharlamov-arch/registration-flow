name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A one-host preview (PUBLIC-HOSTS-02): both origins are this site, so
      # the app mounts onboarding and the portal together, the portal at
      # #/portal, under the repository's sub-path.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /registration-flow/
          VITE_ONBOARDING_ORIGIN: https://akharlamov-arch.github.io
          VITE_PORTAL_ORIGIN: https://akharlamov-arch.github.io

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
