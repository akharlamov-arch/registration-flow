<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Iframe escape: after ZohoSign signing completes, the provider redirects
      the return URL inside the signing iframe rather than in the top window.
      This script detects that condition and immediately navigates the top-level
      window to this URL so the React app renders full-screen with proper layout.
      Must run synchronously before React hydrates.
    -->
    <script>
      (function () {
        if (window.self !== window.top) {
          try {
            window.top.location.replace(window.self.location.href);
          } catch (e) {
            // Cross-origin guard: frameorigin in ZohoSign is set to our domain,
            // so this should never trigger in production.
          }
        }
      })();
    </script>
    <title>iTrucking — Registration</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
